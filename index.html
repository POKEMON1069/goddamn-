<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Qintara — when intelligence reaches out to instinct, the future takes shape."
    />
    <title>Qintara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar reveal">
        <div class="brand" aria-label="Qintara home">qintara</div>

        <nav class="nav" aria-label="Main navigation">
          <a href="#">Services</a>
          <a href="#">How it works</a>
          <a href="#">AI</a>
          <a href="#">Security</a>
          <a href="#">Integrations</a>
          <a href="#">Resources</a>
        </nav>

        <button class="cta-button small" type="button">Get started</button>
      </header>

      <main class="hero">
        <div class="hero-copy reveal">
          <h1>
            When intelligence reaches out<br />
            to instinct, the future takes shape
          </h1>
          <p>
            an unlikely alliance — where human intuition<br />
            and algorithmic precision move as one
          </p>
        </div>

        <button class="cta-button large reveal" type="button">
          <span>See it in action</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>

        <div class="art-stage reveal" aria-hidden="true">
          <div class="pixel-hand hand-left"></div>
          <div class="hero-core">
            <div class="core-glow"></div>
            <div class="core-assembly">
              <span class="cube cube-a"></span>
              <span class="cube cube-b"></span>
              <span class="cube cube-c"></span>
              <span class="cube cube-d"></span>
              <span class="cube cube-e"></span>
            </div>
          </div>
          <div class="pixel-hand hand-right"></div>
          <div class="mini-markers">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
